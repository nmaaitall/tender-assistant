services:
  api:
    build: .
    image: tender-assistant-api
    container_name: tender-assistant-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./app:/srv/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
